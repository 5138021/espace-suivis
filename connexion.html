<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Arbitrage JAJ — Meylan HB 26-27</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --rouge: #E8001D;
    --noir: #0D0D0D;
    --blanc: #F5F2EC;
    --gris: #1A1A1A;
    --gris-mid: #2E2E2E;
    --accent: #FFD100;
    --texte-doux: #9A9A9A;
    --bleu: #4A9FFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--noir);
    color: var(--blanc);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top-stripe, .bottom-stripe {
    height: 4px;
    background: linear-gradient(90deg, var(--rouge) 0%, var(--accent) 50%, var(--rouge) 100%);
  }

  header {
    padding: 2.5rem 3rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    border-bottom: 1px solid #222;
  }

  .logo-badge {
    width: 75px;
    height: 75px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 3px;
    color: var(--blanc);
    line-height: 1;
  }

  .header-text p {
    font-size: 0.72rem;
    color: var(--texte-doux);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.2rem;
    position: relative;
    overflow: hidden;
  }

  main::before {
    content: 'ARBITRAGE';
    position: absolute;
    right: -1rem;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12rem;
    color: rgba(255,255,255,0.03);
    pointer-events: none;
    letter-spacing: 4px;
    white-space: nowrap;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--gris);
    border: 1px solid #262626;
    border-radius: 6px;
    padding: 2.5rem 2.2rem;
    position: relative;
    z-index: 1;
  }

  .login-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--bleu);
    margin-bottom: 0.8rem;
  }

  .login-card h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    line-height: 1.05;
    margin-bottom: 1.8rem;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  label {
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--texte-doux);
    margin-bottom: 0.4rem;
    display: block;
  }

  input {
    width: 100%;
    background: var(--gris-mid);
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    padding: 0.75rem 0.9rem;
    color: var(--blanc);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--bleu);
  }

  .field { display: flex; flex-direction: column; }

  button {
    margin-top: 0.6rem;
    background: var(--bleu);
    color: white;
    border: none;
    border-radius: 3px;
    padding: 0.85rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #3a86e0; }

  .error-msg {
    display: none;
    font-size: 0.75rem;
    color: var(--rouge);
    background: rgba(232,0,29,0.1);
    border: 1px solid rgba(232,0,29,0.3);
    border-radius: 3px;
    padding: 0.6rem 0.8rem;
    margin-top: -0.3rem;
  }

  .error-msg.show { display: block; }

  footer {
    padding: 1.5rem 3rem;
    border-top: 1px solid #222;
    text-align: center;
  }

  footer p {
    font-size: 0.68rem;
    color: var(--texte-doux);
    letter-spacing: 1px;
  }

  @media (max-width: 500px) {
    header { padding: 1.8rem 1.2rem 1.5rem; }
    .login-card { padding: 2rem 1.5rem; }
    main::before { display: none; }
  }
</style>
</head>
<body>

<div class="top-stripe"></div>

<header>
  <img class="logo-badge" src="MHB_logo.png" alt="Logo Meylan Handball">
  <div class="header-text">
    <h1>Suivi Pédagogique</h1>
    <p>Meylan Handball · Arbitrage · Saison 26-27</p>
  </div>
</header>

<main>
  <div class="login-card">
    <p class="login-label">Accès réservé</p>
    <h2>Connexion</h2>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" required>
      </div>

      <p class="error-msg" id="errorMsg">Identifiant incorrect.</p>

      <button type="submit">Se connecter</button>
    </form>
  </div>
</main>

<footer>
  <p>© 2026-2027 Meylan Handball · Commission d'Arbitrage</p>
</footer>

<div class="bottom-stripe"></div>

<script>
  // ============================================================
  // COMPTE ET REDIRECTION — à modifier ici.
  // ATTENTION : ce fichier est visible côté client (dans le code source
  // de la page). Ce système suffit pour filtrer un accès "grand public"
  // mais ne protège pas des données réellement sensibles — pour ça il
  // faudrait une authentification côté serveur.
  // ============================================================
  // ============================================================
  // IDENTIFIANTS ET REDIRECTIONS — à modifier ici.
  // Chaque entrée : "identifiant": "page-cible.html"
  // Ajoute / supprime / modifie autant d'entrées que nécessaire.
  // ATTENTION : ce fichier est visible côté client (dans le code source
  // de la page). Ce système suffit pour filtrer un accès "grand public"
  // mais ne protège pas des données réellement sensibles — pour ça il
  // faudrait une authentification côté serveur.
  // ============================================================
  const COMPTES = {
    "arbitrage": "suivi-arbitrage.html",
    "bureau": "index.html",
    "icr": "commission.html"
    // Ajoute d'autres identifiants ici, séparés par une virgule :
    // "monidentifiant": "mapage.html",
  };

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const pageCible = COMPTES[username];

    if (pageCible) {
      errorMsg.classList.remove('show');
      window.location.href = pageCible;
    } else {
      errorMsg.textContent = "Identifiant incorrect.";
      errorMsg.classList.add('show');
    }
  });
</script>

</body>
</html>
